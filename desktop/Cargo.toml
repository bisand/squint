[package]
name = "squint"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "squint: opens huge text files instantly, lets you look, tweak and save"
publish = false

[[bin]]
name = "squint"
path = "src/main.rs"

[dependencies]
squint-core = { path = "../core", features = ["syntax"] }
# DeniseUI from its repository until the release that carries `TextArea`.
# All four from the same commit: two copies of `denise` would be two types.
denise = { git = "https://github.com/bisand/denise", rev = "24cda989aeca89450d7e5f66621f679d4c038f8d", features = ["std"] }
denise-text = { git = "https://github.com/bisand/denise", rev = "24cda989aeca89450d7e5f66621f679d4c038f8d", features = ["truetype"] }
denise-ui = { git = "https://github.com/bisand/denise", rev = "24cda989aeca89450d7e5f66621f679d4c038f8d", features = ["std", "truetype"] }
denise-winit = { git = "https://github.com/bisand/denise", rev = "24cda989aeca89450d7e5f66621f679d4c038f8d", features = ["gpu"] }
arboard = { version = "3", default-features = false }
# The platform's open, save and question dialogs.
rfd = "0.15"
# Where the list of recent files, the settings and the open tabs are kept.
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# The menu bar is the system's on macOS; everywhere else it is DeniseUI's, in
# the window.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
# To wake the window's loop when a menu row is chosen: see `native_menu::wake`.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
