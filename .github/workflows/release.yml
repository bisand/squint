# Builds squint for every platform when a GitHub release is published, and
# attaches the packages to that release:
#
#   Linux x86_64, aarch64   .tar.gz  .deb  .rpm  .AppImage  (+ Arch .pkg.tar.zst)
#   macOS universal         .dmg  .tar.gz
#   Windows x64, arm64      .zip  -setup.exe
#
# The version comes from the release's tag (v1.2.3 → 1.2.3). Run by hand, or
# on a pull request that changes the packaging, it builds and keeps the
# packages as workflow artifacts without touching any release.
#
# The macOS app is signed with a Developer ID and notarized when these
# repository secrets are set, and signed ad hoc when they are not:
#
#   MACOS_CERTIFICATE           the Developer ID Application certificate and
#                               its key, exported as .p12, in base64
#   MACOS_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   APPLE_ID                    the Apple Account of the developer team
#   APPLE_APP_PASSWORD          an app-specific password for that account
#   APPLE_TEAM_ID               the team's ten-character ID
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)-dev.${{ github.run_number }}"
          fi
          # Cargo takes the version too, so it has to be semver.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version; tag releases like v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging squint $version"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc keeps the binary running on older distributions.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: sed -i "0,/^version = .*/s//version = \"$VERSION\"/" desktop/Cargo.toml
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev rpm file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build
        run: cargo build --release -p squint
      - name: Package
        run: packaging/linux/package.sh "$VERSION" ${{ matrix.arch }} target/release/squint dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  arch-linux:
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: linux
      - name: Build the package
        run: |
          pacman -Syu --noconfirm
          useradd -m builder
          mkdir /home/builder/pkg
          cp packaging/linux/PKGBUILD /home/builder/pkg/
          cp linux/squint-*-linux-x86_64.tar.gz /home/builder/pkg/squint.tar.gz
          # pacman's version may not hold a hyphen.
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/_}/" /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          su builder -c 'cd ~/pkg && makepkg --nodeps --noconfirm'
          mkdir dist
          cp /home/builder/pkg/*.pkg.tar.zst dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: sed -i '' "1,/^version = .*/s/^version = .*/version = \"$VERSION\"/" desktop/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple silicon
        run: cargo build --release -p squint --target aarch64-apple-darwin
      - name: Build for Intel
        run: cargo build --release -p squint --target x86_64-apple-darwin
      # With the signing secrets, the Developer ID certificate goes into a
      # keychain of its own for this run; without them (a fork's pull
      # request, or a repository not set up yet) the app is signed ad hoc.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            if [ "${{ github.event_name }}" = release ]; then
              echo "::warning::MACOS_CERTIFICATE is not set: this release's macOS app is not signed with a Developer ID or notarized"
            fi
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "Signing as $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          packaging/macos/package.sh "$VERSION" \
            target/aarch64-apple-darwin/release/squint \
            target/x86_64-apple-darwin/release/squint \
            dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: sed -i "0,/^version = .*/s//version = \"$VERSION\"/" desktop/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build
        run: cargo build --release -p squint
      - name: Zip
        shell: pwsh
        run: |
          $name = "squint-$env:VERSION-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "stage\$name", dist | Out-Null
          Copy-Item target\release\squint.exe, LICENSE, README.md "stage\$name"
          Compress-Archive -Path "stage\$name" -DestinationPath "dist\$name.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" "/DSource=$env:GITHUB_WORKSPACE\target\release" "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\squint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, arch-linux, macos, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
