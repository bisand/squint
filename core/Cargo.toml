[package]
name = "squint-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "squint engine: a piece-table document over a file that is read only where it is looked at, with a sparse line index"
publish = false

[lib]
name = "squint_core"
path = "src/lib.rs"

[features]
default = []
# Syntax highlighting through syntect's grammars and themes. Off by default so
# the engine alone stays small; the desktop app turns it on.
syntax = ["dep:syntect"]

[dependencies]
bytecount = "0.6"
memchr = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }

[dev-dependencies]
tempfile = "3"
